# ── Server ───────────────────────────────────────────────────────────────────
# listens to all network interfaces not just localhost, so it can be accessed from other machines in the network
server.address=0.0.0.0
# tomcat binds to this port.
server.port=8080

# ── JWT ──────────────────────────────────────────────────────────────────────

app.jwt.secret-key=uN!v1eW#gAtEwAy$2026@sEcReT&kEy^xYz%qRsT
app.jwt.algorithm=HS256
app.jwt.expiration-minutes=60

# ── Upstream services ────────────────────────────────────────────────────────
app.backend-url=http://localhost:8000
app.frontend-url=http://localhost:5173

# ── Redis (token blacklist) ───────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── SSE: raise Tomcat async timeout ceiling to 1 hour ─────────────────────────
# keep sseion alive for 1 hour to allow long-lived SSE connections without timing out
spring.mvc.async.request-timeout=3600000

# ── Logging ──────────────────────────────────────────────────────────────────
# logging in the terminal for debugging purposes
# set DEBUG to Info in production to reduce verbosity
logging.level.com.uniview.gateway=DEBUG
logging.level.org.springframework.security=DEBUG
